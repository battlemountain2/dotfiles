# Window Rules
[[window_rule]]
match.app_id = "^(ghostty|com[.]mitchellh[.]ghostty|kitty|dev[.]noctalia[.]Noctalia|.*[Cc]alc.*|org[.]pulseaudio[.]pavucontrol|blueman-manager|kvantummanager|qt5ct|qt6ct|nwg-look|.*satty.*)$"
default_floating = true

[[window_rule]]
match.app_id = "^dev[.]noctalia[.]UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.app_id = "^org[.]kde[.]dolphin$"
default_floating = true
default_floating_size = { width = 0.50, height = 0.55 }

[[window_rule]]
match.title = "^[Pp]icture[- ]?[Ii]n[- ]?[Pp]icture"
default_floating = true
default_pinned = true
default_floating_size = { width = 0.25, height = 0.25 }

[[window_rule]]
match.is_alone = true
match.is_floating = false
border_width = 0

[[window_rule]]
match.content_type = "game"
default_output = "DP-1"
default_workspace = "9"

[[window_rule]]
match.app_id = "^(steam_app_[0-9]+|gamescope|cs2|deadlock|dota2|Bloodborne|bb-probe)$"
default_output = "DP-1"
default_workspace = "9"

[[window_rule]]
match.app_id = "^(cs2|deadlock|dota2|steam_app_730|steam_app_1422450|steam_app_2767030|steam_app_2356550|steam_app_105600)$"
tearing = true

[[window_rule]]
match.app_id = "^([Ff][Ll]64|[Ee]xplorer)[.][Ee][Xx][Ee]$"
default_output = "DP-1"
default_workspace = "8"
default_floating = true
default_focused = false

[[window_rule]]
blur = true

[[window_rule]]
match.app_id = "^([Zz]en.*|zen.*)$"
blur = true
blur_popups = true
background_render = true

[[window_rule]]
match.app_id = "^io[.]github[.]battlemountain2[.]Iris$"
opacity = 0.98
blur = true

[[layer_rule]]
match.namespace = '^noctalia-(bar-[^"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^"]*)$'
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false
