<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stream Deck Controller</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stream Deck">
  <meta name="application-name" content="Stream Deck">
  <meta name="theme-color" content="#0d1117">
  <link rel="apple-touch-icon" href="/deck/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/deck/apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" href="/deck/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/deck/icon-192.png">
  <link rel="manifest" href="/deck/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px) 16px;
      touch-action: manipulation;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 4px 14px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 6px #ef4444;
      transition: all 0.3s ease;
    }

    .status-dot.connected {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8b949e;
      margin-bottom: 10px;
      padding-left: 2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Deck Button Grid */
    .scene-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    @media (min-width: 500px) {
      .scene-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
    }

    .deck-btn {
      background: #161b22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      min-height: 82px;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s ease, border-color 0.2s ease, background 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .deck-btn:active {
      transform: scale(0.96);
      background: #1f2937;
    }

    .deck-btn .icon {
      font-size: 20px;
      margin-bottom: 6px;
    }

    .deck-btn .title {
      font-size: 12.5px;
      font-weight: 600;
      color: #e6edf3;
      line-height: 1.25;
    }

    .deck-btn .sub {
      font-size: 10px;
      color: #8b949e;
      margin-top: 2px;
    }

    /* Active Scene State */
    .deck-btn.active {
      background: rgba(56, 189, 248, 0.12);
      border: 2px solid #38bdf8 !important;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.35), inset 0 0 12px rgba(56, 189, 248, 0.1);
    }

    .deck-btn.active .title {
      color: #38bdf8;
      font-weight: 700;
    }

    .deck-btn.active .sub {
      color: #7dd3fc;
    }

    .deck-btn.active::after {
      content: '● LIVE';
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 3px 6px;
      border-radius: 4px;
      background: #38bdf8;
      color: #0d1117;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    /* Audio Quick Controls */
    .action-grid,
    .audio-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .action-btn,
    .audio-btn {
      background: #161b22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      min-height: 64px;
    }

    .action-btn:active,
    .audio-btn:active {
      transform: scale(0.97);
    }

    .clip-btn {
      border: 1px solid rgba(239, 68, 68, 0.35);
      background: rgba(239, 68, 68, 0.08);
    }

    .clip-btn:active, .clip-btn.saved {
      background: rgba(239, 68, 68, 0.22);
      border-color: #ef4444;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.35);
    }

    .clip-icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .sink-btn {
      border: 1px solid rgba(168, 85, 247, 0.3);
      background: rgba(168, 85, 247, 0.08);
    }

    .sink-icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(168, 85, 247, 0.2);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: #c084fc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .audio-icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .audio-btn.muted .audio-icon-wrap {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .audio-info {
      display: flex;
      flex-direction: column;
    }

    .audio-name {
      font-size: 12px;
      font-weight: 600;
    }

    .audio-status {
      font-size: 10.5px;
      color: #4ade80;
      font-weight: 500;
    }

    .audio-btn.muted .audio-status {
      color: #f87171;
    }

    /* Music Player Card */
    .music-card {
      background: #161b22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: auto;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    .music-body {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .music-art {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      background: #21262d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      object-fit: cover;
      flex-shrink: 0;
    }

    .music-details {
      flex: 1;
      overflow: hidden;
    }

    .music-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f0f6fc;
    }

    .music-artist {
      font-size: 11.5px;
      color: #8b949e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .music-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .ctrl-btn {
      background: #21262d;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e6edf3;
      border-radius: 8px;
      width: 44px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: transform 0.1s ease, background 0.2s ease;
    }

    .ctrl-btn:active {
      transform: scale(0.92);
      background: #30363d;
    }

    .ctrl-btn.play-btn {
      width: 56px;
      background: #238636;
      border-color: #2ea043;
      font-weight: 700;
    }

    .ctrl-btn.play-btn:active {
      background: #2ea043;
    }

    .install-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #161b22;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 11.5px;
      line-height: 1.5;
      color: #c9d1d9;
    }

    .install-banner strong {
      color: #38bdf8;
    }

    .install-banner .dismiss-btn {
      background: transparent;
      border: none;
      color: #8b949e;
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand">
      <span>🎛️</span>
      <span>DESK CONTROLLER</span>
    </div>
    <div id="obsStatus" class="status-badge">
      <span id="obsDot" class="status-dot"></span>
      <span id="obsText">Connecting...</span>
    </div>
  </div>

  <!-- iOS PWA Standalone Mode Helper Banner -->
  <div id="pwaBanner" class="install-banner">
    <div>
      📲 <strong>Launch as Web App:</strong> Tap Safari's <strong>Share</strong> button (bottom bar ⎋) → tap <strong>Add to Home Screen</strong> ＋. Then launch from your Home Screen for full borderless mode!
    </div>
    <button class="dismiss-btn" onclick="dismissBanner()">✕</button>
  </div>

  <!-- Scenes Section -->
  <div class="section-label">
    <span>OBS Scenes</span>
    <span id="activeSceneName" style="color: #38bdf8; font-weight: 500; text-transform: none;">Starting Soon</span>
  </div>

  <div class="scene-grid" id="sceneGrid">
    <button class="deck-btn" data-scene="Starting Soon" onclick="switchScene('Starting Soon')">
      <span class="icon">⏳</span>
      <div>
        <div class="title">Starting Soon</div>
        <div class="sub">Countdown Card</div>
      </div>
    </button>

    <button class="deck-btn" data-scene="Full Cam" onclick="switchScene('Full Cam')">
      <span class="icon">🎥</span>
      <div>
        <div class="title">Full Cam</div>
        <div class="sub">1080p Yeti Cam</div>
      </div>
    </button>

    <button class="deck-btn" data-scene="Idle" onclick="switchScene('Idle')">
      <span class="icon">☕</span>
      <div>
        <div class="title">Idle / Chill</div>
        <div class="sub">Chat + Music</div>
      </div>
    </button>

    <button class="deck-btn" data-scene="Browser / Reacts" onclick="switchScene('Browser / Reacts')">
      <span class="icon">🌐</span>
      <div>
        <div class="title">Browser / Reacts</div>
        <div class="sub">Desktop & Pip</div>
      </div>
    </button>

    <button class="deck-btn" data-scene="Game scene" onclick="switchScene('Game scene')">
      <span class="icon">🎮</span>
      <div>
        <div class="title">Game Scene</div>
        <div class="sub">Direct GPU Game</div>
      </div>
    </button>

    <button class="deck-btn" data-scene="Be Right Back" onclick="switchScene('Be Right Back')">
      <span class="icon">⏸️</span>
      <div>
        <div class="title">Be Right Back</div>
        <div class="sub">Intermission</div>
      </div>
    </button>

    <button class="deck-btn" data-scene="Stream Ending" onclick="switchScene('Stream Ending')">
      <span class="icon">🏁</span>
      <div>
        <div class="title">Stream Ending</div>
        <div class="sub">Outro Card</div>
      </div>
    </button>
  </div>

  <!-- Quick Actions Section -->
  <div class="section-label">
    <span>Quick Actions</span>
  </div>

  <div class="action-grid">
    <button id="clipBtn" class="action-btn clip-btn" onclick="triggerClip()">
      <div class="clip-icon-wrap" id="clipIcon">🔴</div>
      <div class="audio-info">
        <span class="audio-name" id="clipText">CLIP (60s)</span>
        <span class="audio-status" id="clipSub" style="color: #f87171;">Save Replay</span>
      </div>
    </button>

    <button id="sinkBtn" class="action-btn sink-btn" onclick="toggleSink()">
      <div class="sink-icon-wrap" id="sinkIcon">🎧</div>
      <div class="audio-info">
        <span class="audio-name" id="sinkName">FiiO K11 R2R</span>
        <span class="audio-status" id="sinkSub" style="color: #c084fc;">Headphones</span>
      </div>
    </button>
  </div>

  <!-- Audio Controls Section -->
  <div class="section-label">
    <span>Audio Quick Mute</span>
  </div>

  <div class="audio-grid">
    <button id="micBtn" class="audio-btn" onclick="toggleMute('Mic/Aux')">
      <div class="audio-icon-wrap" id="micIconWrap">🎙️</div>
      <div class="audio-info">
        <span class="audio-name">Mic (Yeti X)</span>
        <span class="audio-status" id="micStatus">LIVE</span>
      </div>
    </button>

    <button id="desktopAudioBtn" class="audio-btn" onclick="toggleMute('Desktop Audio')">
      <div class="audio-icon-wrap" id="desktopIconWrap">🔊</div>
      <div class="audio-info">
        <span class="audio-name">Desktop Audio</span>
        <span class="audio-status" id="desktopStatus">LIVE</span>
      </div>
    </button>
  </div>

  <!-- Cider Music Section -->
  <div class="music-card">
    <div class="music-body">
      <img id="musicCover" class="music-art" src="/assets/cider-icon.png" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'52\' height=\'52\' fill=\'%238b949e\' viewBox=\'0 0 24 24\'><path d=\'M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z\'/></svg>'">
      <div class="music-details">
        <div class="music-title" id="musicTitle">Cider Music</div>
        <div class="music-artist" id="musicArtist">Ready to play</div>
      </div>
    </div>
    <div class="music-controls">
      <button class="ctrl-btn" onclick="mediaAction('previous')">⏮</button>
      <button class="ctrl-btn play-btn" id="playPauseBtn" onclick="mediaAction('playpause')">▶</button>
      <button class="ctrl-btn" onclick="mediaAction('next')">⏭</button>
    </div>
  </div>

  <script>
    function haptic() {
      if (navigator.vibrate) {
        navigator.vibrate(25);
      }
    }

    // --- OBS WebSocket v5 Client ---
    let ws = null;
    let obsConnected = false;
    let currentScene = 'Starting Soon';
    let micMuted = false;
    let desktopMuted = false;

    const obsDot = document.getElementById('obsDot');
    const obsText = document.getElementById('obsText');
    const activeSceneLabel = document.getElementById('activeSceneName');

    function connectOBS() {
      const host = window.location.hostname || '127.0.0.1';
      const wsUrl = `ws://${host}:4455`;

      try {
        ws = new WebSocket(wsUrl);
      } catch (err) {
        setOBSStatus(false);
        setTimeout(connectOBS, 3000);
        return;
      }

      ws.onopen = () => {
        // Wait for Hello (op 0)
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          handleOBSMessage(msg);
        } catch (e) {
          console.error('Error parsing OBS message:', e);
        }
      };

      ws.onclose = () => {
        setOBSStatus(false);
        setTimeout(connectOBS, 3000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    function handleOBSMessage(msg) {
      // Op 0: Hello from OBS
      if (msg.op === 0) {
        // Send Identify (op 1) with EventSubscription.All (2047)
        ws.send(JSON.stringify({
          op: 1,
          d: {
            rpcVersion: 1,
            eventSubscriptions: 2047 // Full subscription: Scenes, Inputs, Transitions, etc.
          }
        }));
      }

      // Op 2: Identified successfully
      else if (msg.op === 2) {
        setOBSStatus(true);
        // Request current scene and audio mute states
        sendOBSRequest('GetCurrentProgramScene', {}, 'init_scene');
        sendOBSRequest('GetInputMute', { inputName: 'Mic/Aux' }, 'init_mic');
        sendOBSRequest('GetInputMute', { inputName: 'Desktop Audio' }, 'init_desktop');
      }

      // Op 7: Response to request
      else if (msg.op === 7) {
        const reqId = msg.d ? msg.d.requestId : null;
        const resp = msg.d && msg.d.responseData ? msg.d.responseData : {};

        if (reqId === 'init_scene') {
          const sceneName = resp.currentProgramSceneName || resp.sceneName;
          if (sceneName) updateActiveScene(sceneName);
        } else if (reqId === 'init_mic') {
          if (typeof resp.inputMuted !== 'undefined') {
            updateMicStatus(resp.inputMuted);
          }
        } else if (reqId === 'init_desktop') {
          if (typeof resp.inputMuted !== 'undefined') {
            updateDesktopStatus(resp.inputMuted);
          }
        }
      }

      // Op 5: Event
      else if (msg.op === 5) {
        const evt = msg.d ? msg.d.eventType : '';
        const data = (msg.d && msg.d.eventData) ? msg.d.eventData : {};

        if (evt === 'CurrentProgramSceneChanged') {
          const newScene = data.sceneName || data.programSceneName;
          if (newScene) updateActiveScene(newScene);
        } else if (evt === 'InputMuteStateChanged') {
          if (data.inputName === 'Mic/Aux') {
            updateMicStatus(data.inputMuted);
          } else if (data.inputName === 'Desktop Audio') {
            updateDesktopStatus(data.inputMuted);
          }
        }
      }
    }

    function sendOBSRequest(type, data = {}, reqId = null) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({
        op: 6,
        d: {
          requestType: type,
          requestId: reqId || `req_${Date.now()}`,
          requestData: data
        }
      }));
    }

    function setOBSStatus(connected) {
      obsConnected = connected;
      if (connected) {
        obsDot.classList.add('connected');
        obsText.textContent = 'OBS Live';
      } else {
        obsDot.classList.remove('connected');
        obsText.textContent = 'OBS Offline';
      }
    }

    function updateActiveScene(name) {
      if (!name) return;
      currentScene = name;
      if (activeSceneLabel) {
        activeSceneLabel.textContent = name;
      }
      const targetLower = name.trim().toLowerCase();
      const buttons = document.querySelectorAll('.deck-btn');
      buttons.forEach(btn => {
        const btnScene = btn.getAttribute('data-scene');
        if (btnScene && btnScene.trim().toLowerCase() === targetLower) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    function switchScene(name) {
      haptic();
      updateActiveScene(name);
      sendOBSRequest('SetCurrentProgramScene', { sceneName: name });
    }

    function toggleMute(inputName) {
      haptic();
      if (inputName === 'Mic/Aux') {
        micMuted = !micMuted;
        updateMicStatus(micMuted);
      } else if (inputName === 'Desktop Audio') {
        desktopMuted = !desktopMuted;
        updateDesktopStatus(desktopMuted);
      }
      sendOBSRequest('ToggleInputMute', { inputName: inputName });
    }

    function updateMicStatus(muted) {
      micMuted = muted;
      const btn = document.getElementById('micBtn');
      const wrap = document.getElementById('micIconWrap');
      const status = document.getElementById('micStatus');
      if (muted) {
        btn.classList.add('muted');
        wrap.textContent = '🔇';
        status.textContent = 'MUTED';
      } else {
        btn.classList.remove('muted');
        wrap.textContent = '🎙️';
        status.textContent = 'LIVE';
      }
    }

    function updateDesktopStatus(muted) {
      desktopMuted = muted;
      const btn = document.getElementById('desktopAudioBtn');
      const wrap = document.getElementById('desktopIconWrap');
      const status = document.getElementById('desktopStatus');
      if (muted) {
        btn.classList.add('muted');
        wrap.textContent = '🔇';
        status.textContent = 'MUTED';
      } else {
        btn.classList.remove('muted');
        wrap.textContent = '🔊';
        status.textContent = 'LIVE';
      }
    }

    // --- Cider / Media Player Client ---
    const coverEl = document.getElementById('musicCover');
    const titleEl = document.getElementById('musicTitle');
    const artistEl = document.getElementById('musicArtist');
    const playBtn = document.getElementById('playPauseBtn');

    function mediaAction(action) {
      haptic();
      fetch(`/api/media?action=${action}`)
        .then(res => res.json())
        .catch(err => console.error('Media error:', err));
    }

    function connectMediaStream() {
      const evtSource = new EventSource('/api/stream');
      evtSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          renderMedia(data);
        } catch (e) {}
      };
      evtSource.onerror = () => {
        evtSource.close();
        setTimeout(connectMediaStream, 3000);
      };
    }

    function renderMedia(data) {
      if (data.status === 'Playing' && data.title) {
        titleEl.textContent = data.title;
        artistEl.textContent = data.artist || 'Unknown Artist';
        playBtn.textContent = '⏸';
      } else if (data.status === 'Paused' && data.title) {
        titleEl.textContent = data.title;
        artistEl.textContent = data.artist || 'Unknown Artist';
        playBtn.textContent = '▶';
      } else {
        titleEl.textContent = 'No track playing';
        artistEl.textContent = 'Cider idle';
        playBtn.textContent = '▶';
      }

      if (data.art_url) {
        coverEl.src = `/api/art?url=${encodeURIComponent(data.art_url)}`;
      }
    }

    // --- Quick Actions: Clip & Audio Sink ---
    function triggerClip() {
      haptic();
      const btn = document.getElementById('clipBtn');
      const text = document.getElementById('clipText');
      const sub = document.getElementById('clipSub');
      text.textContent = 'SAVING...';
      btn.classList.add('saved');

      fetch('/api/clip')
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            text.textContent = 'SAVED! ✔';
            sub.textContent = 'Saved to ~/Videos';
            setTimeout(() => {
              text.textContent = 'CLIP (60s)';
              sub.textContent = 'Save Replay';
              btn.classList.remove('saved');
            }, 2500);
          } else {
            text.textContent = 'ERROR';
            setTimeout(() => {
              text.textContent = 'CLIP (60s)';
              btn.classList.remove('saved');
            }, 2000);
          }
        })
        .catch(() => {
          text.textContent = 'OFFLINE';
          setTimeout(() => {
            text.textContent = 'CLIP (60s)';
            btn.classList.remove('saved');
          }, 2000);
        });
    }

    function updateSinkUI(data) {
      const icon = document.getElementById('sinkIcon');
      const name = document.getElementById('sinkName');
      const sub = document.getElementById('sinkSub');
      if (data.current_sink === 'speaker') {
        icon.textContent = '🔊';
        name.textContent = 'Speakers';
        sub.textContent = 'Redragon ALC897';
        sub.style.color = '#38bdf8';
      } else {
        icon.textContent = '🎧';
        name.textContent = 'FiiO K11 R2R';
        sub.textContent = 'ATH-R50x';
        sub.style.color = '#c084fc';
      }
    }

    function checkSink() {
      fetch('/api/sink')
        .then(res => res.json())
        .then(updateSinkUI)
        .catch(() => {});
    }

    function toggleSink() {
      haptic();
      fetch('/api/sink?action=toggle')
        .then(res => res.json())
        .then(updateSinkUI)
        .catch(() => {});
    }

    // Initialize
    connectOBS();
    connectMediaStream();
    checkSink();
    setInterval(checkSink, 10000);

    // Check if running as standalone web app
    const isStandalone = (window.navigator.standalone === true) || window.matchMedia('(display-mode: standalone)').matches;
    if (!isStandalone && !localStorage.getItem('hide_deck_banner')) {
      const banner = document.getElementById('pwaBanner');
      if (banner) banner.style.display = 'flex';
    }

    function dismissBanner() {
      localStorage.setItem('hide_deck_banner', '1');
      const banner = document.getElementById('pwaBanner');
      if (banner) banner.style.display = 'none';
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/deck/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
