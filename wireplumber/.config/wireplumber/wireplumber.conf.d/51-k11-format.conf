monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.usb-FIIO_FiiO_K11_R2R-01.playback.0.0" }
    ]
    actions = {
      update-props = {
        audio.format = "S32LE"
        # The K11 R2R is stereo; avoid the raw ALSA 64-channel probe default.
        audio.channels = 2
        audio.position = [ FL FR ]
        audio.allowed-rates = "44100,48000,88200,96000,176400,192000,352800,384000"
        node.max-latency = 0
        api.alsa.period-size = 128
        api.alsa.headroom = 128
      }
    }
  }
]
