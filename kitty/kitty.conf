# ==============================================================================
# VISUALS & PERFORMANCE
# ==============================================================================
background_opacity         0.6
window_padding_width       20
cursor_trail               1
cursor_trail_decay         0.1 0.4
cursor_blink_interval      0
disable_ligatures          never
confirm_os_window_close    0

# Shell Integration (ensures smooth prompt scrolling & cursor shapes)
shell_integration          enabled

# ==============================================================================
# FONTS (Recommended: Install JetBrains Mono Nerd Font or your preferred NF)
# ==============================================================================
font_family                family="Iosevka Term Nerd Font"
bold_font                  auto
italic_font                auto
bold_italic_font           auto
font_size                  11.5

# Enable code ligatures (Iosevka has fantastic programming ligatures)
disable_ligatures never

# ==============================================================================
# CELL SPACING (Giving Iosevka room to breathe)
# ==============================================================================
# Because Iosevka is tall and narrow, slightly padding cell height or baseline
# makes it look much more readable and balanced in Kitty.
modify_font cell_height 105%
# modify_font baseline 0

# ==============================================================================
# MOUSE & CLIPBOARD (Right-Click Paste & Selection Tricks)
# ==============================================================================
# Right-click pastes from clipboard if ungrabbed by apps like Vim
mouse_map right press ungrabbed paste_from_clipboard

# Automatically copy selected text to system clipboard
copy_on_select             clipboard
strip_trailing_spaces      smart

# URL handling (Ctrl + Click to open link in browser)
detect_urls                yes
url_style                  curly
open_url_with              default

# Hide mouse cursor when typing
mouse_hide_wait            3.0

# ==============================================================================
# SCROLLBACK & PERFORMANCE
# ==============================================================================
scrollback_lines           10000
wheel_scroll_multiplier    5.0

# Power-user feature: Press Ctrl+Shift+H to search scrollback output in a pager
scrollback_pager           less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ==============================================================================
# TAB BAR AESTHETICS (Powerline Style)
# ==============================================================================
tab_bar_edge               bottom
tab_bar_style              powerline
tab_powerline_style        slanted
active_tab_font_style      bold

# ==============================================================================
# KEY BINDINGS & SHORTCUTS
# ==============================================================================
# Seamless Copy/Paste shortcuts
map ctrl+c                 copy_and_clear_or_interrupt
map ctrl+v                 paste_from_clipboard

# Font size controls
map ctrl+equal             change_font_size all +1.0
map ctrl+minus             change_font_size all -1.0
map ctrl+0                 change_font_size all 0

# Tab navigation shortcuts
map ctrl+shift+t           new_tab
map ctrl+shift+q           close_tab
map ctrl+shift+right       next_tab
map ctrl+shift+left        previous_tab

# Config Reload Shortcut
map ctrl+shift+r           reload_config

# ==============================================================================
# THEME (Kept at bottom so theme overrides base defaults)
# ==============================================================================
# BEGIN_KITTY_THEME
# Noctalia
include current-theme.conf
# END_KITTY_THEME
