screencopy {
    # Apps reuse their capture grant, so the picker only appears on an app's
    # first request rather than every time.
    allow_token_by_default = true

    # Swap the stock picker for one with live window/monitor previews.
    # xdph still does the actual capture -- this replaces the selection UI only.
    # https://github.com/WhySoBad/hyprland-preview-share-picker
    custom_picker_binary = hyprland-preview-share-picker
}
