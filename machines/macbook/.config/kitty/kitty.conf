# ==============================================================================
# OMARCHY THEME (Synchronizes dynamically with active theme)
# ==============================================================================
include ~/.local/state/omarchy/current/theme/kitty.conf

# Allow remote access for Omarchy shell/window title tracking
allow_remote_control yes
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}

# ==============================================================================
# VISUALS & PERFORMANCE
# ==============================================================================
background_opacity         0.6
window_padding_width       20
window_margin_width        8
cursor_trail               1
cursor_trail_decay         0.1 0.4
cursor_blink_interval      0
disable_ligatures          cursor
confirm_os_window_close    0
hide_window_decorations    yes
enable_audio_bell          no

# Shell Integration (ensures smooth prompt scrolling & cursor shapes)
shell_integration          enabled

# ==============================================================================
# FONTS
# ==============================================================================
font_family                JetBrainsMono Nerd Font
bold_font                  auto
italic_font                auto
bold_italic_font           auto
font_size                  11.0

# ==============================================================================
# MOUSE & CLIPBOARD (Right-Click Paste & Selection Tricks)
# ==============================================================================
# Right-click pastes from clipboard if ungrabbed by apps like Vim
mouse_map right press ungrabbed paste_from_clipboard

# URL handling (Ctrl + Click to open link in browser)
detect_urls                yes
url_style                  curly
open_url_with              default

# Hide mouse cursor when typing
mouse_hide_wait            3.0

# ==============================================================================
# SCROLLBACK & PERFORMANCE
# ==============================================================================
scrollback_lines           10000
wheel_scroll_multiplier    5.0

# Search scrollback output in a pager
scrollback_pager           less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ==============================================================================
# TAB BAR AESTHETICS (Powerline Style)
# ==============================================================================
tab_bar_edge               bottom
tab_bar_style              powerline
tab_powerline_style        slanted
active_tab_font_style      bold
tab_title_template         "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}"

# ==============================================================================
# KEY BINDINGS & SHORTCUTS
# ==============================================================================
# Seamless Copy/Paste shortcuts
map ctrl+c                 copy_and_clear_or_interrupt
map ctrl+v                 paste_from_clipboard

# Shift/Alt+Enter encoding for CSI-u TUIs
map shift+enter            send_text all \e[13;2u
map alt+shift+enter        send_text all \e[13;4u

# Font size controls
map ctrl+equal             change_font_size all +1.0
map ctrl+minus             change_font_size all -1.0
map ctrl+0                 change_font_size all 0

# Tab navigation shortcuts
map ctrl+shift+t           new_tab
map ctrl+shift+q           close_tab
map ctrl+shift+right       next_tab
map ctrl+shift+left        previous_tab

# Config Reload Shortcut
map ctrl+shift+r           reload_config
